<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>VR Console — Phase 0 Spike</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0f1115;
				--panel: #171a21;
				--fg: #e5e7eb;
				--muted: #8b93a1;
				--accent: #4a9eed;
				--green: #22c55e;
				--amber: #f59e0b;
				--red: #ef4444;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
				background: var(--bg);
				color: var(--fg);
				display: flex;
				flex-direction: column;
				height: 100vh;
			}
			header {
				padding: 10px 16px;
				background: var(--panel);
				border-bottom: 1px solid #262b36;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			header h1 { font-size: 14px; margin: 0; font-weight: 600; }
			#status { color: var(--muted); font-size: 12px; }
			#log {
				flex: 1;
				overflow-y: auto;
				padding: 12px 16px;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.line { padding: 1px 0; }
			.assistant { color: var(--fg); }
			.tool { color: var(--accent); }
			.notice { color: var(--muted); }
			.notice.warn { color: var(--amber); }
			.notice.error { color: var(--red); }
			.marker { color: var(--green); }
			.raw { color: var(--muted); font-size: 12px; }
			footer {
				display: flex;
				gap: 8px;
				padding: 10px 16px;
				background: var(--panel);
				border-top: 1px solid #262b36;
			}
			#prompt {
				flex: 1;
				background: var(--bg);
				color: var(--fg);
				border: 1px solid #2b313d;
				border-radius: 6px;
				padding: 8px 10px;
				font: inherit;
			}
			button {
				background: var(--accent);
				color: #04121f;
				border: 0;
				border-radius: 6px;
				padding: 8px 14px;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:disabled { opacity: 0.4; cursor: not-allowed; }
			#approve { background: var(--amber); }
		</style>
	</head>
	<body>
		<header>
			<h1>VR Console — Phase 0 Spike</h1>
			<span id="status">connecting…</span>
		</header>
		<div id="log"></div>
		<footer>
			<input id="prompt" placeholder="Prompt the agent…  (read-only tasks only while auto-approve is on)" autofocus />
			<button id="send">Send</button>
			<button id="approve" disabled title="Phase 1: approve a pending tool call">Approve</button>
		</footer>

		<script>
			const logEl = document.getElementById("log");
			const statusEl = document.getElementById("status");
			const promptEl = document.getElementById("prompt");
			const sendEl = document.getElementById("send");

			function append(cls, text) {
				const div = document.createElement("div");
				div.className = "line " + cls;
				div.textContent = text;
				logEl.appendChild(div);
				logEl.scrollTop = logEl.scrollHeight;
			}

			// Best-effort extraction of a streaming assistant text delta. The exact
			// shape of assistantMessageEvent is confirmed when you run the spike —
			// this tries the common fields and otherwise prints the frame compactly.
			function assistantDelta(ev) {
				const a = ev.assistantMessageEvent;
				if (!a) return null;
				return a.delta?.text ?? a.text ?? a.delta ?? null;
			}

			function render(frame) {
				switch (frame.type) {
					case "notice":
						append("notice " + (frame.level || ""), "· " + frame.message);
						break;
					case "message_update": {
						const d = assistantDelta(frame);
						if (typeof d === "string") {
							// stream deltas inline into the last assistant line
							const last = logEl.lastElementChild;
							if (last && last.classList.contains("assistant")) last.textContent += d;
							else append("assistant", d);
						} else {
							append("raw", JSON.stringify(frame));
						}
						break;
					}
					case "tool_execution_start":
						append("tool", "⚙ tool → " + (frame.toolName || "?"));
						break;
					case "tool_stream_update":
						append("tool", "  … " + (frame.toolName || "") + " streaming");
						break;
					case "message_start":
						if (frame.message?.role === "assistant") append("assistant", "");
						break;
					case "message_end":
						break;
					case "turn_end":
						append("marker", "— turn end —");
						break;
					case "agent_end":
						append("marker", "— agent end —");
						break;
					default:
						append("raw", JSON.stringify(frame));
				}
			}

			let ws;
			function connect() {
				const proto = location.protocol === "https:" ? "wss" : "ws";
				ws = new WebSocket(proto + "://" + location.host + "/ws");
				ws.onopen = () => {
					statusEl.textContent = "connected";
				};
				ws.onclose = () => {
					statusEl.textContent = "disconnected — retrying…";
					setTimeout(connect, 1500);
				};
				ws.onmessage = e => {
					try {
						render(JSON.parse(e.data));
					} catch {
						append("raw", e.data);
					}
				};
			}
			connect();

			function send() {
				const text = promptEl.value.trim();
				if (!text || ws.readyState !== WebSocket.OPEN) return;
				append("assistant", "");
				append("notice", "› " + text);
				ws.send(JSON.stringify({ type: "prompt", text }));
				promptEl.value = "";
			}
			sendEl.onclick = send;
			promptEl.addEventListener("keydown", e => {
				if (e.key === "Enter" && !e.shiftKey) {
					e.preventDefault();
					send();
				}
			});
		</script>
	</body>
</html>
