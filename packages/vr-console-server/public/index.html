<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>VR Console — Phase 1 (approval cards)</title>
		<style>
			:root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --fg:#e5e7eb; --muted:#8b93a1;
				--accent:#4a9eed; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --card:#1d2330; }
			* { box-sizing: border-box; }
			body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
			header { padding:10px 16px; background:var(--panel); border-bottom:1px solid #262b36; display:flex; align-items:center; gap:12px; }
			header h1 { font-size:14px; margin:0; font-weight:600; }
			#status { color:var(--muted); font-size:12px; }
			#log { flex:1; overflow-y:auto; padding:12px 16px; white-space:pre-wrap; word-break:break-word; }
			.line { padding:1px 0; }
			.assistant { color:var(--fg); } .tool { color:var(--accent); }
			.notice { color:var(--muted); } .notice.warn { color:var(--amber); } .notice.error { color:var(--red); }
			.marker { color:var(--green); } .raw { color:var(--muted); font-size:12px; }
			#cards { display:flex; flex-direction:column; gap:8px; padding:0 16px; }
			.card { background:var(--card); border:1px solid #2b313d; border-left:3px solid var(--amber); border-radius:8px; padding:10px 12px; }
			.card.approval { border-left-color:var(--amber); } .card.input { border-left-color:var(--accent); }
			.card h3 { margin:0 0 6px; font-size:13px; color:var(--amber); }
			.card pre { margin:6px 0; max-height:220px; overflow:auto; background:#0c0f14; padding:8px; border-radius:6px; font-size:12px; color:#cdd3dd; }
			.card .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
			footer { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-top:1px solid #262b36; }
			#prompt { flex:1; background:var(--bg); color:var(--fg); border:1px solid #2b313d; border-radius:6px; padding:8px 10px; font:inherit; }
			input.dlg { flex:1; background:var(--bg); color:var(--fg); border:1px solid #2b313d; border-radius:6px; padding:6px 8px; font:inherit; }
			button { border:0; border-radius:6px; padding:7px 13px; font:inherit; font-weight:600; cursor:pointer; background:#2b313d; color:var(--fg); }
			button.go { background:var(--accent); color:#04121f; }
			button.approve { background:var(--green); color:#04140a; }
			button.deny { background:var(--red); color:#fff; }
			button.session { background:var(--amber); color:#140d00; }
		</style>
	</head>
	<body>
		<header>
			<h1>VR Console — Phase 1</h1>
			<span id="status">connecting…</span>
			<span style="color:var(--muted);font-size:12px">approvals: <b style="color:var(--green)">on</b> (always-ask)</span>
		</header>
		<div id="cards"></div>
		<div id="log"></div>
		<footer>
			<input id="prompt" placeholder="Prompt the agent…  (read-only tasks only — tool calls now raise approval cards)" autofocus />
			<button class="go" id="send">Send</button>
			<button id="campaigns" title="GET /api/campaigns">Campaigns</button>
		</footer>

		<script>
			const logEl = document.getElementById("log");
			const cardsEl = document.getElementById("cards");
			const statusEl = document.getElementById("status");
			const promptEl = document.getElementById("prompt");

			function append(cls, text) {
				const d = document.createElement("div");
				d.className = "line " + cls; d.textContent = text;
				logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
			}
			function assistantDelta(ev) {
				const a = ev.assistantMessageEvent; if (!a) return null;
				return a.delta?.text ?? a.text ?? (typeof a.delta === "string" ? a.delta : null);
			}

			let ws;
			function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

			// ---- approval / dialog cards ----
			function removeCard(id) { const el = document.getElementById("card-" + id); if (el) el.remove(); }
			function replyAndClose(id, value) { send({ type: "reply", id, value }); removeCard(id); }

			function renderApproval(f) {
				const card = document.createElement("div");
				card.className = "card approval"; card.id = "card-" + f.id;
				const grants = (f.grants || []).map(g =>
					`<button class="session" data-grant="${g.scope}" data-always="0">${g.label}</button>` +
					`<button class="session" data-grant="${g.scope}" data-always="1">${g.alwaysLabel}</button>`
				).join("");
				card.innerHTML =
					`<h3>⚠ Tool approval requested</h3>` +
					`<pre>${escapeHtml(f.full || f.compact || "(no detail)")}</pre>` +
					`<div class="row">` +
						`<button class="approve" data-a="once">Approve once</button>` +
						(f.session ? `<button class="session" data-a="session">${escapeHtml(f.session)}</button>` : ``) +
						grants +
						`<button class="deny" data-a="deny">Deny</button>` +
					`</div>`;
				card.querySelectorAll("button").forEach(b => b.onclick = () => {
					if (b.dataset.a) return replyAndClose(f.id, b.dataset.a);
					replyAndClose(f.id, { grant: b.dataset.grant, always: b.dataset.always === "1" });
				});
				cardsEl.appendChild(card);
			}
			function renderInput(f) {
				const card = document.createElement("div");
				card.className = "card input"; card.id = "card-" + f.id;
				card.innerHTML = `<h3>${escapeHtml(f.title || "Operator input")}</h3>` +
					`<div class="row"><input class="dlg" id="in-${f.id}" placeholder="${escapeHtml(f.placeholder || "")}" />` +
					`<button class="go">Send</button><button class="deny">Cancel</button></div>`;
				const inp = card.querySelector("input");
				const btns = card.querySelectorAll("button");
				btns[0].onclick = () => replyAndClose(f.id, inp.value);
				btns[1].onclick = () => replyAndClose(f.id, undefined);
				inp.addEventListener("keydown", e => { if (e.key === "Enter") replyAndClose(f.id, inp.value); });
				cardsEl.appendChild(card); inp.focus();
			}
			function renderConfirm(f) {
				const card = document.createElement("div");
				card.className = "card input"; card.id = "card-" + f.id;
				card.innerHTML = `<h3>${escapeHtml(f.title || "Confirm")}</h3><pre>${escapeHtml(f.message || "")}</pre>` +
					`<div class="row"><button class="approve">Yes</button><button class="deny">No</button></div>`;
				const btns = card.querySelectorAll("button");
				btns[0].onclick = () => replyAndClose(f.id, true);
				btns[1].onclick = () => replyAndClose(f.id, false);
				cardsEl.appendChild(card);
			}
			function renderSelect(f) {
				const card = document.createElement("div");
				card.className = "card input"; card.id = "card-" + f.id;
				const opts = (f.options || []).map(o => `<button data-v="${escapeHtml(o.label)}">${escapeHtml(o.label)}</button>`).join("");
				card.innerHTML = `<h3>${escapeHtml(f.title || "Select")}</h3><div class="row">${opts}<button class="deny" data-v="">Cancel</button></div>`;
				card.querySelectorAll("button").forEach(b => b.onclick = () => replyAndClose(f.id, b.dataset.v || undefined));
				cardsEl.appendChild(card);
			}
			function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

			function render(f) {
				switch (f.type) {
					case "approval_request": return renderApproval(f);
					case "input_request": return renderInput(f);
					case "confirm_request": return renderConfirm(f);
					case "select_request": return renderSelect(f);
					case "notice": return append("notice " + (f.level || ""), "· " + f.message);
					case "message_update": {
						const d = assistantDelta(f);
						if (typeof d === "string") {
							const last = logEl.lastElementChild;
							if (last && last.classList.contains("assistant")) last.textContent += d; else append("assistant", d);
						} else append("raw", JSON.stringify(f));
						return;
					}
					case "tool_execution_start": return append("tool", "⚙ tool → " + (f.toolName || "?"));
					case "message_start": if (f.message?.role === "assistant") append("assistant", ""); return;
					case "message_end": return;
					case "turn_end": return append("marker", "— turn end —");
					case "agent_end": return append("marker", "— agent end —");
					default: return append("raw", JSON.stringify(f));
				}
			}

			function connect() {
				const proto = location.protocol === "https:" ? "wss" : "ws";
				ws = new WebSocket(proto + "://" + location.host + "/ws");
				ws.onopen = () => statusEl.textContent = "connected";
				ws.onclose = () => { statusEl.textContent = "disconnected — retrying…"; setTimeout(connect, 1500); };
				ws.onmessage = e => { try { render(JSON.parse(e.data)); } catch { append("raw", e.data); } };
			}
			connect();

			function sendPrompt() {
				const text = promptEl.value.trim();
				if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
				append("assistant", ""); append("notice", "› " + text);
				send({ type: "prompt", text }); promptEl.value = "";
			}
			document.getElementById("send").onclick = sendPrompt;
			promptEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); } });

			document.getElementById("campaigns").onclick = async () => {
				try {
					const r = await fetch("/api/campaigns?scope=all");
					const data = await r.json();
					if (!r.ok) { append("notice error", "· /api/campaigns → " + (data.error || r.status)); return; }
					if (!data.length) { append("notice", "· no campaigns found (set VR_LAB_ROOT to the vr-lab checkout)"); return; }
					for (const c of data) {
						append("tool", `▸ ${c.id} [${c.platform}${c.archived ? " · archived" : ""}]  ` +
							`H:${c.counts.hallucinations} F:${c.counts.findings} R:${c.counts.rejected} S:${c.counts.surfaces}` +
							(c.title ? `  (${c.title})` : ""));
					}
				} catch (err) { append("notice error", "· campaigns fetch failed: " + err); }
			};
		</script>
	</body>
</html>
